function doJoin(){const code=(document.getElementById('j-code').value||'').trim().toUpperCase();const pwd=(document.getElementById('j-pwd').value||'').trim();const myName=(document.getElementById('j-name').value||'').trim();const role=document.getElementById('j-role').value;let all=getFamilies();let fam=all[code];if(!fam){fam={familyName:'Nehme',code:code,members:[{name:'Abdallah',role:'Father',emoji:'👨'},{name:'Nado',role:'Mother',emoji:'👩'},{name:'Talia',role:'Daughter',emoji:'👧'},{name:'Mohamad',role:'Son',emoji:'👦'},{name:'Perla',role:'Daughter',emoji:'👧'}],password:pwd};if(!fam.members.find(x=>x.name===myName))fam.members.push({name:myName,role:role,emoji:'👤'});all[code]=fam;saveFamilies(all);}else{if(fam.password&&fam.password!==pwd){document.getElementById('j-err').style.display='block';document.getElementById('j-err').textContent='Wrong password';return;}if(!fam.members.find(x=>x.name.toLowerCase()===myName.toLowerCase())){fam.members.push({name:myName,role:role,emoji:'👤'});all[code]=fam;saveFamilies(all);}}setCurrentCode(code);setCurrentUser({name:myName,role:role});view='chat';render()}
function sendMsg(){const input=document.getElementById('msg-input');if(!input||!input.value.trim())return;const text=input.value.trim();const cur=getCurrentUser()||{name:'You',role:''};const code=getCurrentCode();const key='famline_msgs_'+code;const msgs=JSON.parse(localStorage.getItem(key)||'[]');const msg={sender:cur.name,role:cur.role,text:text,ts:Date.now()};msgs.push(msg);localStorage.setItem(key,JSON.stringify(msgs));appendMsg(msg);input.value='';if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'chat',familyCode:code,sender:msg.sender,role:msg.role,text:msg.text,ts:msg.ts}))}
(function(){const curCode=getCurrentCode();const fams=getFamilies();if(curCode&&fams[curCode]){view='chat';render();return;}render();})();
</script></body></html>
