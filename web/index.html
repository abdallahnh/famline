<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>FamLine iOS Fixed</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui;background:#fdf6ec;color:#111;height:100vh;overflow:hidden}#root{height:100vh;display:flex;flex-direction:column}.card{background:#fff;border-radius:20px;padding:18px;border:1px solid #eee;margin-bottom:14px}.btn{padding:11px 16px;border-radius:999px;border:0;font-weight:700;cursor:pointer}.btn-black{background:#111;color:#fff}.btn-light{background:#fff;border:1px solid #ddd}.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ddd;background:#fafafa;font-size:16px}.member-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid #eee;background:#fff;margin-bottom:8px}.chat-layout{display:flex;height:100vh}.sidebar{width:300px;background:#fff;border-right:1px solid #eee;display:flex;flex-direction:column}.main{flex:1;display:flex;flex-direction:column;min-width:0}.msg{max-width:78%;padding:10px 14px;border-radius:18px;margin-bottom:8px;font-size:14px;word-break:break-word}.msg.me{background:#111;color:#fff;margin-left:auto}.msg.other{background:#fff;border:1px solid #e5e5e5;margin-right:auto}.topbar{padding:10px 12px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}#callModal{display:none;position:fixed;inset:0;background:#111;z-index:50;flex-direction:column;color:#fff}#callModal.show{display:flex}.video-grid{display:flex;flex:1;gap:8px;padding:12px;justify-content:center;align-items:center;flex-wrap:wrap}.video-grid video{width:45%;max-width:320px;height:220px;background:#222;border-radius:16px;object-fit:cover}audio#remoteAudio{display:none}#notifBanner{display:none;position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#fff;padding:10px 14px;z-index:90;justify-content:space-between;align-items:center}#notifBanner.show{display:flex}@media(max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .28s ease;width:84%;max-width:340px}.sidebar.open{transform:translateX(0)}}</style></head><body><div id="root"></div><div id="notifBanner"><div><b>🔔 Enable Notifications</b><div style="font-size:11px">For background calls</div></div><button id="enableNotifBtn" style="background:#fff;color:#f59e0b;padding:6px 12px;border-radius:999px;border:0;font-weight:700">Enable</button></div><div id="callModal"><div style="padding:14px;display:flex;justify-content:space-between"><div><b id="callTitle">Calling...</b><div id="callStatus" style="font-size:12px;opacity:.7">Connecting</div></div><button onclick="endCall()" style="padding:8px 12px;border-radius:8px;border:0">✕</button></div><div class="video-grid"><video id="localVideo" autoplay muted playsinline webkit-playsinline></video><video id="remoteVideo" autoplay playsinline webkit-playsinline></video><audio id="remoteAudio" autoplay playsinline></audio></div><div style="padding:20px;text-align:center;display:flex;gap:10px;justify-content:center"><button onclick="endCall()" style="background:#ef4444;color:#fff;padding:14px 28px;border-radius:999px;border:0;font-weight:700">End Call</button><button id="muteBtn" onclick="toggleMute()" style="padding:12px 18px;border-radius:999px;border:0;background:#333;color:#fff">🎤 Mute</button><button id="speakerBtn" onclick="toggleSpeaker()" style="padding:12px 18px;border-radius:999px;border:0;background:#333;color:#fff">🔊 Speaker</button></div></div><script>
const VAPID_PUBLIC="BATeuCAksUg6_iGRtHVtooaaBiLKFhSk7alN2CKCNkZG3OCsR7A-d2brzOOCAU6xp7ucfyXAolTj2YueJUeIydQ";
const LS_FAMS='famline_families',LS_CUR_CODE='famline_current_code',LS_CUR_USER='famline_current_user';
function getFamilies(){try{return JSON.parse(localStorage.getItem(LS_FAMS)||'{}')}catch{return {}}}
function saveFamilies(f){localStorage.setItem(LS_FAMS,JSON.stringify(f))}
function getCurrentCode(){return localStorage.getItem(LS_CUR_CODE)}
function setCurrentCode(c){localStorage.setItem(LS_CUR_CODE,c)}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem(LS_CUR_USER)||'null')}catch{return null}}
function setCurrentUser(u){localStorage.setItem(LS_CUR_USER,JSON.stringify(u))}
function genCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let a='';for(let i=0;i<4;i++)a+=s[Math.floor(Math.random()*s.length)];let b='';for(let i=0;i<4;i++)b+=s[Math.floor(Math.random()*s.length)];return `FAM-${a}-${b}`}
let view='landing',joinPrefillCode='';
let createMembers=[{name:'Abdallah',role:'Father',emoji:'👨'},{name:'Nado',role:'Mother',emoji:'👩'},{name:'Talia',role:'Daughter',emoji:'👧'},{name:'Mohamad',role:'Son',emoji:'👦'},{name:'Perla',role:'Daughter',emoji:'👧'}];
let ws=null,pc=null,localStream=null,isMuted=false;

document.getElementById('enableNotifBtn')?.addEventListener('click',async()=>{const p=await Notification.requestPermission();if(p==='granted'){document.getElementById('notifBanner').classList.remove('show');initPWA();}});

async function initPWA(){
 if(!('serviceWorker' in navigator)) return;
 try{
  const reg=await navigator.serviceWorker.register('/sw.js');
  if(Notification.permission==='default') document.getElementById('notifBanner').classList.add('show');
  if(Notification.permission==='granted'){
    document.getElementById('notifBanner').classList.remove('show');
    try{
      let sub=await reg.pushManager.getSubscription();
      if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
      if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'push-subscribe',familyCode:getCurrentCode(),subscription:sub,user:getCurrentUser()}));
      window._pushSub=sub;
    }catch(e){console.error('Push failed',e);}
  }
 }catch(e){console.error(e);}
}
function urlBase64ToUint8Array(b64){const p='='.repeat((4-b64.length%4)%4);const base=(b64+p).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}

// FIXED createPC - null-safe + iPhone audio fix
async function createPC(isVideo){
  if(pc){try{pc.close()}catch{}; pc=null;}
  pc=new RTCPeerConnection({
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'},
      {urls:'stun:stun2.l.google.com:19302'},
      {urls:'stun:stun3.l.google.com:19302'},
      {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'},
      {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'}
    ],
    iceCandidatePoolSize:10
  });
  pc._q=[]; pc._remoteSet=false;
  pc.onicecandidate=e=>{if(e.candidate&&ws&&ws.readyState===1) ws.send(JSON.stringify({type:'ice',familyCode:getCurrentCode(),candidate:e.candidate}))};
  
  // iOS FIX: Use both video and audio elements for sound
  pc.ontrack=e=>{
    console.log('Track received', e.track.kind);
    if(e.track.kind==='video'){
      const rv=document.getElementById('remoteVideo');
      rv.srcObject=e.streams[0];
      rv.play().catch(err=>console.log('Video play blocked',err));
    }
    if(e.track.kind==='audio'){
      const audioEl=document.getElementById('remoteAudio');
      // iOS needs separate audio element
      if(audioEl.srcObject!==e.streams[0]){
        audioEl.srcObject=e.streams[0];
        audioEl.play().catch(err=>{
          console.log('Audio play blocked - need user tap',err);
          // Show tap to enable sound button
          document.getElementById('callStatus').textContent='Tap to enable sound 🔊';
          document.getElementById('callStatus').onclick=()=>{audioEl.play(); document.getElementById('remoteVideo').play();};
        });
      }
    }
    document.getElementById('callStatus').textContent='Connected ✅ - Sound on';
  };
  pc.onconnectionstatechange=()=>{
    document.getElementById('callStatus').textContent='Call: '+pc.connectionState;
    if(pc.connectionState==='failed'){try{pc.restartIce()}catch{}}
  };

  try{
    const constraints=isVideo?{video:{facingMode:'user'}, audio:{echoCancellation:true}}:{audio:{echoCancellation:true}};
    localStream=await navigator.mediaDevices.getUserMedia(constraints);
  }catch(err){
    try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(err2){
      alert('Mic needed: '+err2.message); throw err2;
    }
  }

  if(!localStream) throw new Error('No stream');
  if(!pc) throw new Error('No PC');
  
  localStream.getTracks().forEach(track=>{
    if(track && pc){try{pc.addTrack(track, localStream);}catch(e){console.error('addTrack fail',e);}}
  });
  
  const lv=document.getElementById('localVideo');
  lv.srcObject=localStream; lv.muted=true; lv.playsInline=true;
  lv.play().catch(()=>{});
  return pc;
}

async function startCall(isVideo){
  document.getElementById('callModal').classList.add('show');
  document.getElementById('callTitle').textContent=isVideo?'Video - Nehme':'Voice - Nehme';
  document.getElementById('callStatus').textContent='Starting...';
  try{
    await createPC(isVideo);
    const offer=await pc.createOffer({offerToReceiveAudio:true, offerToReceiveVideo:isVideo});
    await pc.setLocalDescription(offer);
    document.getElementById('callStatus').textContent='Calling... waiting for answer';
    if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'call-offer',familyCode:getCurrentCode(),offer:offer,isVideo:isVideo,from:getCurrentUser()?.name}));
  }catch(e){alert('Call failed: '+e.message); endCall();}
}

async function handleOffer(m){
  if(document.getElementById('callModal').classList.contains('show')) return;
  if(!confirm(`${m.from||'Family'} calling ${m.isVideo?'video':'voice'}. Answer?`)){if(ws) ws.send(JSON.stringify({type:'call-declined',familyCode:getCurrentCode()})); return;}
  document.getElementById('callModal').classList.add('show');
  document.getElementById('callTitle').textContent=`From ${m.from}`;
  document.getElementById('callStatus').textContent='Answering...';
  try{
    await createPC(m.isVideo);
    await pc.setRemoteDescription(new RTCSessionDescription(m.offer));
    pc._remoteSet=true;
    if(pc._q.length){for(const c of pc._q){await pc.addIceCandidate(new RTCIceCandidate(c))} pc._q=[];}
    const ans=await pc.createAnswer();
    await pc.setLocalDescription(ans);
    if(ws) ws.send(JSON.stringify({type:'call-answer',familyCode:getCurrentCode(),answer:ans}));
    document.getElementById('callStatus').textContent='Connecting P2P...';
  }catch(e){alert('Answer failed: '+e.message); endCall();}
}

function endCall(){
  document.getElementById('callModal').classList.remove('show');
  if(pc){try{pc.close()}catch{}; pc=null;}
  if(localStream){localStream.getTracks().forEach(t=>{try{t.stop()}catch{}}); localStream=null;}
  document.getElementById('localVideo').srcObject=null;
  document.getElementById('remoteVideo').srcObject=null;
  document.getElementById('remoteAudio').srcObject=null;
  if(ws) ws.send(JSON.stringify({type:'call-end',familyCode:getCurrentCode()}));
}
function toggleMute(){if(!localStream) return; isMuted=!isMuted; localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); document.getElementById('muteBtn').textContent=isMuted?'🔇 Unmute':'🎤 Mute';}
function toggleSpeaker(){
  const audio=document.getElementById('remoteAudio');
  audio.setSinkId&&audio.setSinkId(audio.sinkId===''? 'speaker' : '').catch(()=>{});
  document.getElementById('speakerBtn').textContent='🔊 Speaker';
}

function connectSignaling(){
 if(ws&&ws.readyState===1) return;
 ws=new WebSocket('wss://famline-signaling.onrender.com');
 ws.onopen=()=>{
  const c=getCurrentCode(),u=getCurrentUser();
  if(c&&u){
    ws.send(JSON.stringify({type:'join',familyCode:c,name:u.name}));
    if(window._pushSub) ws.send(JSON.stringify({type:'push-subscribe',familyCode:c,subscription:window._pushSub,user:u}));
  }
  updateStatus(true);
  // Heartbeat for iOS - keeps WS alive
  clearInterval(ws._hb);
  ws._hb=setInterval(()=>{if(ws.readyState===1) ws.send(JSON.stringify({type:'ping'}))}, 25000);
 };
 ws.onclose=()=>{clearInterval(ws._hb); updateStatus(false); setTimeout(connectSignaling, 2000);};
 ws.onmessage=async(ev)=>{
  try{
   const m=JSON.parse(ev.data);
   if(m.type==='chat'){
    const key='famline_msgs_'+(getCurrentCode()||'default');
    const msgs=JSON.parse(localStorage.getItem(key)||'[]');
    if(!msgs.find(x=>x.ts===m.ts&&x.sender===m.sender)){
      msgs.push(m); localStorage.setItem(key,JSON.stringify(msgs));
      if(view==='chat') appendMsg(m);
      // Also save to separate persistent store for iOS (localStorage can be cleared)
      try{
        const backupKey='famline_backup_'+getCurrentCode();
        const backup=JSON.parse(localStorage.getItem(backupKey)||'[]');
        backup.push(m);
        if(backup.length>500) backup.shift();
        localStorage.setItem(backupKey,JSON.stringify(backup));
      }catch{}
    }
   }else if(m.type==='history'&&m.messages){
    // FIX FOR iOS OLD MESSAGES NOT LOADING - merge with backup
    const key='famline_msgs_'+getCurrentCode();
    const ex=JSON.parse(localStorage.getItem(key)||'[]');
    const backupKey='famline_backup_'+getCurrentCode();
    const backup=JSON.parse(localStorage.getItem(backupKey)||'[]');
    const allMsgs=[...ex, ...backup, ...m.messages];
    // Deduplicate by ts+sender
    const seen=new Set();
    const merged=[];
    allMsgs.forEach(msg=>{
      const id=msg.ts+'_'+msg.sender;
      if(!seen.has(id)){seen.add(id); merged.push(msg);}
    });
    merged.sort((a,b)=>a.ts-b.ts);
    localStorage.setItem(key,JSON.stringify(merged));
    localStorage.setItem(backupKey,JSON.stringify(merged.slice(-500)));
    if(view==='chat'){document.getElementById('msg-list').innerHTML=''; merged.forEach(appendMsg); setTimeout(()=>{const c=document.getElementById('messages'); if(c) c.scrollTop=c.scrollHeight}, 100);}
   }else if(m.type==='call-offer'){handleOffer(m);}
   else if(m.type==='call-answer'){if(pc){await pc.setRemoteDescription(new RTCSessionDescription(m.answer)); pc._remoteSet=true; if(pc._q.length){for(const c of pc._q){await pc.addIceCandidate(new RTCIceCandidate(c))} pc._q=[];} document.getElementById('callStatus').textContent='Connected ✅';}}
   else if(m.type==='ice'){if(pc){try{if(pc._remoteSet) await pc.addIceCandidate(new RTCIceCandidate(m.candidate)); else pc._q.push(m.candidate);}catch{}}}
   else if(m.type==='call-end'||m.type==='call-declined'){endCall();}
  }catch(e){console.error(e);}
 };
}
function updateStatus(online){const el=document.getElementById('conn-status'); if(el){el.innerHTML=online?'<span style="display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%"></span> Live • iOS Fixed':'● Connecting...';}}
function appendMsg(m){const list=document.getElementById('msg-list'); if(!list) return; const cur=getCurrentUser(); const isMe=cur&&m.sender===cur.name; const div=document.createElement('div'); div.className='msg '+(isMe?'me':'other'); div.innerHTML=`<b style="font-size:11px;opacity:.6">${m.sender} • ${m.role}</b><br>${(m.text||'').replace(/</g,'&lt;')}<br><span style="font-size:10px;opacity:.5">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`; list.appendChild(div); const c=document.getElementById('messages'); if(c) c.scrollTop=c.scrollHeight;}
function render(){
 const root=document.getElementById('root'); const families=getFamilies(); const curCode=getCurrentCode(); const curFam=curCode?families[curCode]:null; const curUser=getCurrentUser();
 if(view==='chat'&&curFam){
  root.innerHTML=`<div class="chat-layout"><div class="sidebar" id="sidebar"><div style="padding:14px;border-bottom:1px solid #eee"><b>${curFam.familyName}</b> • ${curFam.code}<div id="conn-status" style="font-size:11px">Connecting...</div><div style="font-size:11px;opacity:.6">You: ${curUser?curUser.name:'?'} • iOS Fixed</div></div><div style="flex:1;overflow:auto;padding:12px">${curFam.members.map(m=>`<div class="member-row"><span>${m.emoji}</span><div style="flex:1"><b style="font-size:13px">${m.name}</b><div style="font-size:11px;opacity:.6">${m.role}</div></div></div>`).join('')}</div><div style="padding:12px;border-top:1px solid #eee"><button class="btn btn-light" style="width:100%" onclick="view='landing';render()">Switch</button></div></div><div class="main"><div class="topbar"><b>${curFam.familyName} • ${curFam.code}</b><div style="display:flex;gap:6px"><button class="btn btn-black" style="padding:8px 12px;font-size:12px" onclick="startCall(false)">📞 Call</button><button class="btn btn-light" style="padding:8px 12px;font-size:12px" onclick="startCall(true)">📹 Video</button></div></div><div id="messages" style="flex:1;overflow:auto;padding:12px;background:#fdf6ec"><div id="msg-list"></div></div><div style="padding:10px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px"><input id="msg-input" class="input" placeholder="Message as ${curUser?curUser.name:'You'}..." onkeydown="if(event.key==='Enter')sendMsg()" style="flex:1"><button class="btn btn-black" onclick="sendMsg()">Send</button></div></div></div>`;
  const key='famline_msgs_'+curCode; const msgs=JSON.parse(localStorage.getItem(key)||'[]'); msgs.forEach(appendMsg); connectSignaling(); setTimeout(()=>{const c=document.getElementById('messages'); if(c) c.scrollTop=c.scrollHeight;}, 150); return;
 }
 const existing=Object.keys(families);
 root.innerHTML=`<div style="max-width:520px;margin:0 auto;padding:16px;overflow:auto;height:100vh"><h2>FamLine iOS Fixed</h2>${existing.length?`<div class="card">${existing.map(c=>{const f=families[c]; return `<div class="member-row" style="justify-content:space-between"><div><b>${f.familyName}</b> • ${f.code}</div><button class="btn btn-black" style="padding:8px 14px" onclick="setCurrentCode('${c}');view='chat';render()">Open</button></div>`}).join('')}</div>`:''}<div class="card"><h3>Fixed: iPhone sound + messages</h3><p style="font-size:12px;opacity:.7">Fixes addTrack crash, black screen, no sound, old messages not loading on iOS</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-black" onclick="view='create';render()">+ Create</button><button class="btn btn-light" style="border:2px solid #111" onclick="view='join';render()">↪ Join</button></div></div>${view==='create'?`<div class="card"><input id="c-fname" class="input" value="Nehme" style="margin:6px 0"><input id="c-pwd" class="input" type="password" placeholder="Password" style="margin:6px 0"><input id="c-myname" class="input" value="Abdallah" style="margin:6px 0"><button class="btn btn-black" onclick="doCreate()">Create</button><div id="c-result" style="display:none;margin-top:12px"></div></div>`:''}${view==='join'?`<div class="card"><input id="j-code" class="input" placeholder="FAM-XXXX-XXXX" value="${joinPrefillCode}" style="margin:6px 0"><input id="j-pwd" class="input" type="password" placeholder="Password" style="margin:6px 0"><input id="j-name" class="input" placeholder="Your name" style="margin:6px 0"><button class="btn btn-black" onclick="doJoin()">Join</button><div id="j-err" style="color:red;font-size:12px;display:none"></div></div>`:''}</div>`;
}
function doCreate(){const famName=document.getElementById('c-fname').value||'Nehme';const pwd=document.getElementById('c-pwd').value;const myName=document.getElementById('c-myname').value||'Abdallah'; if(!pwd){alert('pwd');return} const code=genCode(); const fam={familyName:famName,name:famName,code:code,members:createMembers,password:pwd}; const all=getFamilies(); all[code]=fam; saveFamilies(all); setCurrentCode(code); setCurrentUser({name:myName,role:'Father'}); localStorage.setItem('famline_family_v2',JSON.stringify(fam)); const b64=btoa(unescape(encodeURIComponent(JSON.stringify({n:famName,m:fam.members,c:code})))); const invite=location.origin+location.pathname+'#invite='+b64; document.getElementById('c-result').style.display='block'; document.getElementById('c-result').innerHTML=`Created ${code}<br><input class="input" value="${invite}" readonly><br><button class="btn btn-black" onclick="view='chat';render()">Enter</button>`;}
function doJoin(){const code=(document.getElementById('j-code').value||'').trim().toUpperCase();const pwd=(document.getElementById('j-pwd').value||'').trim();const myName=(document.getElementById('j-name').value||'').trim();const role='Daughter'; if(!code||!pwd||!myName){document.getElementById('j-err').style.display='block'; document.getElementById('j-err').textContent='Fill all'; return} let all=getFamilies(); let fam=all[code]; if(!fam){fam={familyName:'Nehme',name:'Nehme',code:code,members:createMembers,password:pwd}; all[code]=fam; saveFamilies(all);} if(fam.password&&fam.password!==pwd){document.getElementById('j-err').style.display='block'; document.getElementById('j-err').textContent='Wrong pwd'; return} setCurrentCode(code); setCurrentUser({name:myName,role:role}); history.replaceState(null,'',location.pathname); view='chat'; render(); setTimeout(()=>{initPWA(); if(Notification.permission==='default') Notification.requestPermission().then(p=>{if(p==='granted') initPWA();})},500);}
function sendMsg(){const input=document.getElementById('msg-input'); if(!input||!input.value.trim()) return; const text=input.value.trim(); const cur=getCurrentUser()||{name:'You',role:''}; const code=getCurrentCode(); const key='famline_msgs_'+code; const msgs=JSON.parse(localStorage.getItem(key)||'[]'); const msg={sender:cur.name,role:cur.role,text:text,ts:Date.now()}; msgs.push(msg); localStorage.setItem(key,JSON.stringify(msgs)); appendMsg(msg); input.value=''; if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'chat',familyCode:code,sender:msg.sender,role:msg.role,text:msg.text,ts:msg.ts}));}
(function(){const p=new URLSearchParams(location.search); const curCode=getCurrentCode(); const fams=getFamilies(); if(curCode&&fams[curCode]){view='chat'; if(p.has('join')||location.hash.includes('invite=')){history.replaceState(null,'',location.pathname);} render(); initPWA(); return;} if(p.has('join')){joinPrefillCode=p.get('join').toUpperCase(); view='join'} if(location.hash.includes('invite=')){try{const b64=location.hash.split('invite=')[1]; const data=JSON.parse(decodeURIComponent(escape(atob(b64)))); joinPrefillCode=data.c||''; view='join'}catch{}} render(); initPWA();})();
</script></body></html>
