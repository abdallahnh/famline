<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>FamLine - Nehme</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fdf6ec;color:#111;height:100vh;overflow:hidden}#root{height:100vh;display:flex;flex-direction:column}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #eee;margin-bottom:14px}.btn{padding:11px 16px;border-radius:999px;border:0;font-weight:700;cursor:pointer;font-size:13px}.btn-black{background:#111;color:#fff}.btn-light{background:#fff;border:1px solid #ddd}.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ddd;background:#fafafa;font-size:16px;outline:none}.member-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid #eee;background:#fff;margin-bottom:8px}.chat-layout{display:flex;height:100vh;position:relative}.sidebar{width:300px;background:#fff;border-right:1px solid #eee;display:flex;flex-direction:column;flex-shrink:0}.main{flex:1;display:flex;flex-direction:column;min-width:0}.msg{max-width:78%;padding:10px 14px;border-radius:18px;margin-bottom:8px;font-size:14px;line-height:1.4;word-break:break-word}.msg.me{background:#111;color:#fff;margin-left:auto;border-bottom-right-radius:6px}.msg.other{background:#fff;border:1px solid #e5e5e5;margin-right:auto;border-bottom-left-radius:6px}.topbar{padding:10px 12px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:8px}#callModal{display:none;position:fixed;inset:0;background:#111;z-index:50;flex-direction:column;color:#fff}#callModal.show{display:flex}.video-grid{display:flex;flex:1;gap:8px;padding:12px;justify-content:center;align-items:center;flex-wrap:wrap}.video-grid video{width:45%;max-width:320px;height:220px;background:#222;border-radius:16px;object-fit:cover}</style></head><body><div id="root"></div><div id="callModal"><div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><div><b id="callTitle">Calling...</b><div id="callStatus" style="font-size:12px;opacity:.7">Connecting via P2P</div></div><button onclick="endCall()" style="padding:8px 12px;border-radius:8px;border:0">✕</button></div><div class="video-grid"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video></div><div style="padding:20px;text-align:center;display:flex;gap:10px;justify-content:center"><button onclick="endCall()" style="background:#ef4444;color:#fff;padding:14px 28px;border-radius:999px;border:0;font-weight:700">End Call</button><button id="muteBtn" onclick="toggleMute()" style="padding:12px 18px;border-radius:999px;border:0;background:#333;color:#fff">🎤 Mute</button></div></div><script>
const LS_FAMS='famline_families',LS_CUR_CODE='famline_current_code',LS_CUR_USER='famline_current_user';
function getFamilies(){try{return JSON.parse(localStorage.getItem(LS_FAMS)||'{}')}catch{return {}}}
function saveFamilies(f){localStorage.setItem(LS_FAMS,JSON.stringify(f))}
function getCurrentCode(){return localStorage.getItem(LS_CUR_CODE)}
function setCurrentCode(c){localStorage.setItem(LS_CUR_CODE,c)}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem(LS_CUR_USER)||'null')}catch{return null}}
function setCurrentUser(u){localStorage.setItem(LS_CUR_USER,JSON.stringify(u))}
function genCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let a='';for(let i=0;i<4;i++)a+=s[Math.floor(Math.random()*s.length)];let b='';for(let i=0;i<4;i++)b+=s[Math.floor(Math.random()*s.length)];return `FAM-${a}-${b}`}
let view='landing',joinPrefillCode='';
let createMembers=[{name:'Abdallah',role:'Father',emoji:'👨'},{name:'Nado',role:'Mother',emoji:'👩'},{name:'Talia',role:'Daughter',emoji:'👧'},{name:'Mohamad',role:'Son',emoji:'👦'},{name:'Perla',role:'Daughter',emoji:'👧'}];
let ws=null,pc=null,localStream=null;
function connectSignaling(){if(ws&&ws.readyState===1)return;ws=new WebSocket('wss://famline-signaling.onrender.com');ws.onopen=()=>{const c=getCurrentCode(),u=getCurrentUser();if(c&&u)ws.send(JSON.stringify({type:'join',familyCode:c,name:u.name}))};ws.onmessage=async(ev)=>{const m=JSON.parse(ev.data);if(m.type==='chat'){const key='famline_msgs_'+(getCurrentCode()||'default');const msgs=JSON.parse(localStorage.getItem(key)||'[]');if(!msgs.find(x=>x.ts===m.ts&&x.sender===m.sender)){msgs.push(m);localStorage.setItem(key,JSON.stringify(msgs));if(view==='chat')appendMsg(m)}}else if(m.type==='history'&&m.messages){const key='famline_msgs_'+getCurrentCode();const ex=JSON.parse(localStorage.getItem(key)||'[]');const merged=[...ex];m.messages.forEach(h=>{if(!merged.find(x=>x.ts===h.ts&&x.sender===h.sender))merged.push(h)});merged.sort((a,b)=>a.ts-b.ts);localStorage.setItem(key,JSON.stringify(merged));if(view==='chat'){document.getElementById('msg-list').innerHTML='';merged.forEach(appendMsg)}}else if(m.type==='call-offer'){handleOffer(m)}else if(m.type==='call-answer'){if(pc)await pc.setRemoteDescription(new RTCSessionDescription(m.answer))}else if(m.type==='ice'){if(pc){try{if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(m.candidate));else{(pc._q=pc._q||[]);pc._q.push(m.candidate)}}catch{}}}else if(m.type==='call-end'){endCall()}};ws.onclose=()=>setTimeout(connectSignaling,2000);}
function appendMsg(m){const list=document.getElementById('msg-list');if(!list)return;const cur=getCurrentUser();const isMe=cur&&m.sender===cur.name;const div=document.createElement('div');div.className='msg '+(isMe?'me':'other');div.innerHTML=`<b style="font-size:11px;display:block;opacity:.6">${m.sender} • ${m.role}</b>${m.text}<br><span style="font-size:10px;opacity:.5">${new Date(m.ts).toLocaleTimeString()}</span>`;list.appendChild(div);const c=document.getElementById('messages');if(c)c.scrollTop=c.scrollHeight}
async function createPC(isVideo){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'},{urls:'stun:stun3.l.google.com:19302'}],iceCandidatePoolSize:10});pc._q=[];pc.onicecandidate=e=>{if(e.candidate&&ws&&ws.readyState===1)ws.send(JSON.stringify({type:'ice',familyCode:getCurrentCode(),candidate:e.candidate}))};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];document.getElementById('callStatus').textContent='Connected ✅';};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')pc.restartIce();};try{localStream=await navigator.mediaDevices.getUserMedia({video:isVideo,audio:true});}catch{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));document.getElementById('localVideo').srcObject=localStream;return pc;}
async function startCall(isVideo){document.getElementById('callModal').classList.add('show');document.getElementById('callTitle').textContent=isVideo?'Video - Nehme':'Voice - Nehme';document.getElementById('callStatus').textContent='Calling...';await createPC(isVideo);const offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:isVideo});await pc.setLocalDescription(offer);if(ws)ws.send(JSON.stringify({type:'call-offer',familyCode:getCurrentCode(),offer:offer,isVideo:isVideo,from:getCurrentUser()?.name}));}
async function handleOffer(m){if(document.getElementById('callModal').classList.contains('show'))return;if(!confirm(`${m.from||'Family'} calling ${m.isVideo?'video':'voice'}. Answer?`))return;document.getElementById('callModal').classList.add('show');document.getElementById('callTitle').textContent=`From ${m.from||'family'}`;await createPC(m.isVideo);await pc.setRemoteDescription(new RTCSessionDescription(m.offer));if(pc._q&&pc._q.length){for(const c of pc._q){await pc.addIceCandidate(new RTCIceCandidate(c))}pc._q=[];}const ans=await pc.createAnswer();await pc.setLocalDescription(ans);if(ws)ws.send(JSON.stringify({type:'call-answer',familyCode:getCurrentCode(),answer:ans}));}
function endCall(){document.getElementById('callModal').classList.remove('show');if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}document.getElementById('localVideo').srcObject=null;document.getElementById('remoteVideo').srcObject=null;if(ws)ws.send(JSON.stringify({type:'call-end',familyCode:getCurrentCode()}))}
function render(){const root=document.getElementById('root');const families=getFamilies();const curCode=getCurrentCode();const curFam=curCode?families[curCode]:null;const curUser=getCurrentUser();if(view==='chat'&&curFam){root.innerHTML=`<div class="chat-layout"><div class="sidebar"><div style="padding:14px;border-bottom:1px solid #eee"><b>${curFam.familyName}</b> <span style="font-size:10px;background:#111;color:#fff;padding:3px 8px;border-radius:999px">${curFam.code}</span><div style="font-size:11px;opacity:.6">You: ${curUser?curUser.name:'?'} • Live</div></div><div style="flex:1;overflow:auto;padding:12px">${curFam.members.map(m=>`<div class="member-row"><span style="font-size:20px">${m.emoji}</span><div style="flex:1"><b style="font-size:13px">${m.name}</b><div style="font-size:11px;opacity:.6">${m.role}</div></div></div>`).join('')}</div></div><div class="main"><div class="topbar"><b>${curFam.familyName} • ${curFam.code}</b><div style="display:flex;gap:6px"><button class="btn btn-black" style="padding:8px 12px;font-size:12px" onclick="startCall(false)">📞 Call</button><button class="btn" style="padding:8px 12px;font-size:12px;background:#fff;border:1px solid #ddd" onclick="startCall(true)">📹 Video</button></div></div><div id="messages" style="flex:1;overflow:auto;padding:12px"><div id="msg-list"></div></div><div style="padding:10px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px"><input id="msg-input" class="input" placeholder="Message as ${curUser?curUser.name:'You'}..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn btn-black" onclick="sendMsg()">Send</button></div></div></div>`;const key='famline_msgs_'+curCode;const msgs=JSON.parse(localStorage.getItem(key)||'[]');msgs.forEach(appendMsg);connectSignaling();return;}const existing=Object.keys(families);root.innerHTML=`<div style="max-width:520px;margin:0 auto;padding:20px"><h2>FamLine</h2>${existing.length?`<div class="card"><h4>Your families</h4>${existing.map(c=>{const f=families[c];return `<div class="member-row" style="justify-content:space-between"><div><b>${f.familyName}</b> • ${f.code}</div><button class="btn btn-black" style="padding:8px 14px" onclick="setCurrentCode('${c}');view='chat';render()">Open</button></div>`}).join('')}</div>`:''}<div class="card"><h3>Your Family, Private & Secure</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn btn-black" onclick="view='create';render()">+ Create</button><button class="btn" style="background:#fff;border:2px solid #111" onclick="view='join';render()">↪ Join</button></div></div>${view==='create'?`<div class="card"><h3>Create</h3><input id="c-fname" class="input" value="Nehme" style="margin:6px 0 12px"><input id="c-pwd" class="input" type="password" placeholder="Family password" style="margin:6px 0 12px"><input id="c-myname" class="input" value="Abdallah" style="margin:6px 0 12px"><button class="btn btn-black" onclick="doCreate()">Create</button><div id="c-result" style="display:none;margin-top:12px"></div></div>`:''}${view==='join'?`<div class="card" style="border:2px solid #f97316"><h3>Join Family</h3><input id="j-code" class="input" placeholder="FAM-XXXX-XXXX" value="${joinPrefillCode}" style="text-transform:uppercase;margin:6px 0 12px"><input id="j-pwd" class="input" type="password" placeholder="Family password" style="margin:6px 0 12px"><input id="j-name" class="input" placeholder="Talia / Nado" style="margin:6px 0 12px"><select id="j-role" class="input" style="margin:6px 0 14px"><option>Father</option><option>Mother</option><option>Son</option><option selected>Daughter</option></select><button class="btn btn-black" onclick="doJoin()">Join as Me</button><div id="j-err" style="color:#ef4444;font-size:12px;margin-top:8px;display:none"></div></div>`:''}</div>`;}
function doCreate(){const famName=document.getElementById('c-fname').value.trim()||'Nehme';const pwd=document.getElementById('c-pwd').value.trim();const myName=document.getElementById('c-myname').value.trim()||createMembers[0].name;if(!pwd){alert('Set pwd');return}const code=genCode();const fam={familyName:famName,name:famName,code:code,familyCode:code,members:createMembers,password:pwd};const all=getFamilies();all[code]=fam;saveFamilies(all);setCurrentCode(code);setCurrentUser({name:myName,role:createMembers.find(m=>m.name===myName)?.role||'Father'});localStorage.setItem('famline_family_v2',JSON.stringify(fam));const b64=btoa(unescape(encodeURIComponent(JSON.stringify({n:famName,m:fam.members,c:code}))));const invite=location.origin+location.pathname+'#invite='+b64;document.getElementById('c-result').style.display='block';document.getElementById('c-result').innerHTML=`Created ${famName} ${code}<br><input class="input" value="${invite}" readonly onclick="this.select()"><br><button class="btn btn-black" onclick="view='chat';render()">Enter Chat</button>`;}
function doJoin(){const code=(document.getElementById('j-code').value||'').trim().toUpperCase();const pwd=(document.getElementById('j-pwd').value||'').trim();const myName=(document.getElementById('j-name').value||'').trim();const role=document.getElementById('j-role').value;const err=document.getElementById('j-err');if(!code||!pwd||!myName){err.style.display='block';err.textContent='Fill all';return}let all=getFamilies();let fam=all[code];if(!fam){fam={familyName:'Nehme',name:'Nehme',code:code,familyCode:code,members:[{name:'Abdallah',role:'Father',emoji:'👨'},{name:'Nado',role:'Mother',emoji:'👩'},{name:'Talia',role:'Daughter',emoji:'👧'},{name:'Mohamad',role:'Son',emoji:'👦'},{name:'Perla',role:'Daughter',emoji:'👧'}],password:pwd};if(!fam.members.find(x=>x.name.toLowerCase()===myName.toLowerCase()))fam.members.push({name:myName,role:role,emoji:'👤'});all[code]=fam;saveFamilies(all)}else{if(fam.password&&fam.password!==pwd){err.style.display='block';err.textContent='Wrong pwd';return}if(!fam.members.find(x=>x.name.toLowerCase()===myName.toLowerCase())){fam.members.push({name:myName,role:role,emoji:'👤'});all[code]=fam;saveFamilies(all)}}localStorage.setItem('famline_family_v2',JSON.stringify(fam));setCurrentCode(code);setCurrentUser({name:myName,role:role});history.replaceState(null,'',location.pathname);view='chat';render();}
function sendMsg(){const input=document.getElementById('msg-input');if(!input||!input.value.trim())return;const text=input.value.trim();const cur=getCurrentUser()||{name:'You',role:''};const code=getCurrentCode();const key='famline_msgs_'+code;const msgs=JSON.parse(localStorage.getItem(key)||'[]');const msg={sender:cur.name,role:cur.role,text:text,ts:Date.now()};msgs.push(msg);localStorage.setItem(key,JSON.stringify(msgs));appendMsg(msg);input.value='';if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'chat',familyCode:code,sender:msg.sender,role:msg.role,text:msg.text,ts:msg.ts}));}
(function(){const p=new URLSearchParams(location.search);const curCode=getCurrentCode();const fams=getFamilies();if(curCode&&fams[curCode]){view='chat';if(p.has('join')||location.hash.includes('invite=')){history.replaceState(null,'',location.pathname);}render();return;}if(p.has('join')){joinPrefillCode=p.get('join').toUpperCase();view='join'}if(location.hash.includes('invite=')){try{const b64=location.hash.split('invite=')[1];const data=JSON.parse(decodeURIComponent(escape(atob(b64))));joinPrefillCode=data.c||'';view='join'}catch{}}render();})();
</script></body></html>
