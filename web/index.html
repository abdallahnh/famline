<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FamLine - Family Chat</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter;background:#fdf6ec;color:#111;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column}
.card{background:white;border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid #eee}
.btn{padding:14px 20px;border-radius:999px;border:0;font-weight:800;cursor:pointer;font-size:14px}
.btn-black{background:#111;color:white}
.btn-orange{background:#f97316;color:white}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ddd;background:#fafafa;font-size:16px;outline:none}
.input:focus{border-color:#111}
.badge{font-size:10px;background:#111;color:white;padding:4px 10px;border-radius:999px;letter-spacing:.5px}
.member-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid #eee;background:#fff;margin-bottom:8px}
.chat-layout{display:flex;height:100vh}
.sidebar{width:280px;background:#fff;border-right:1px solid #eee;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;background:#fdf6ec}
.msg{max-width:70%;padding:12px 14px;border-radius:18px;margin-bottom:8px;font-size:14px;line-height:1.4}
.msg.me{background:#111;color:white;margin-left:auto;border-bottom-right-radius:6px}
.msg.other{background:white;border:1px solid #eee;margin-right:auto;border-bottom-left-radius:6px}
.topbar{padding:14px 16px;background:white;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
@media(max-width:768px){.sidebar{position:absolute;z-index:20;height:100%;transform:translateX(-100%);transition:.3s}.sidebar.open{transform:translateX(0)}.main{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ===== STORAGE =====
const LS_FAMS='famline_families', LS_CUR_CODE='famline_current_code', LS_CUR_USER='famline_current_user';
function getFamilies(){try{return JSON.parse(localStorage.getItem(LS_FAMS)||'{}')}catch{return {}}}
function saveFamilies(f){localStorage.setItem(LS_FAMS, JSON.stringify(f))}
function getCurrentCode(){return localStorage.getItem(LS_CUR_CODE)}
function setCurrentCode(c){localStorage.setItem(LS_CUR_CODE,c)}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem(LS_CUR_USER)||'null')}catch{return null}}
function setCurrentUser(u){localStorage.setItem(LS_CUR_USER, JSON.stringify(u))}
function genCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let a='';for(let i=0;i<4;i++)a+=s[Math.floor(Math.random()*s.length)];let b='';for(let i=0;i<4;i++)b+=s[Math.floor(Math.random()*s.length)];return `FAM-${a}-${b}`}

// ===== STATE =====
let view='landing'; // landing, create, join, chat
let joinPrefillCode='';
let createMembers=[
  {name:'Abdallah',role:'Father',emoji:'👨',age:'Adult'},
  {name:'Nado',role:'Mother',emoji:'👩',age:'Adult'},
  {name:'Talia',role:'Daughter',emoji:'👧',age:'Kid'},
  {name:'Mohamad',role:'Son',emoji:'👦',age:'Kid'},
  {name:'Perla',role:'Daughter',emoji:'👧',age:'Kid'},
];

// ===== RENDER =====
function render(){
  const root=document.getElementById('root');
  const families=getFamilies();
  const curCode=getCurrentCode();
  const curFam=curCode?families[curCode]:null;
  const curUser=getCurrentUser();

  // If we have a current family and view is chat, show chat
  if(view==='chat' && curFam){
    root.innerHTML = `
      <div class="chat-layout">
        <div class="sidebar open" id="sidebar">
          <div style="padding:16px;border-bottom:1px solid #eee">
            <div style="display:flex;justify-content:space-between;align-items:center"><b>${curFam.familyName||curFam.name}</b><span class="badge">${curFam.code}</span></div>
            <div style="font-size:11px;opacity:.6;margin-top:4px">You: ${curUser?curUser.name:'?'} • E2E Encrypted</div>
          </div>
          <div style="flex:1;overflow:auto;padding:12px">
            ${curFam.members.map(m=>`
              <div class="member-row"><span style="font-size:22px">${m.emoji}</span><div style="flex:1"><div style="font-weight:700;font-size:13px">${m.name} ${curUser && curUser.name===m.name?'(You)':''}</div><div style="font-size:11px;opacity:.6">${m.role} • ${m.age||''}</div></div><div style="width:8px;height:8px;background:#22c55e;border-radius:50%"></div></div>
            `).join('')}
          </div>
          <div style="padding:12px;border-top:1px solid #eee;display:flex;gap:8px">
            <button class="btn" style="flex:1;background:#fff;border:1px solid #ddd;font-size:12px" onclick="view='landing';render()">↩ Switch Family</button>
            <button class="btn" style="flex:1;background:#fee2e2;font-size:12px;color:#ef4444" onclick="if(confirm('Leave family?')){const fams=getFamilies();delete fams['${curCode}'];saveFamilies(fams);localStorage.removeItem(LS_CUR_CODE);view='landing';render()}">Leave</button>
          </div>
        </div>
        <div class="main">
          <div class="topbar">
            <div style="display:flex;gap:10px;align-items:center">
              <button onclick="document.getElementById('sidebar').classList.toggle('open')" style="border:0;background:#eee;padding:8px;border-radius:10px">☰</button>
              <div><b>${curFam.familyName}</b><div style="font-size:11px;opacity:.6">Family-only • Encrypted • No cloud</div></div>
            </div>
            <div style="display:flex;gap:8px"><button class="btn btn-black" style="padding:8px 14px;font-size:12px">📞 Call</button><button class="btn" style="padding:8px 14px;font-size:12px;background:white;border:1px solid #ddd">📹 Video</button></div>
          </div>
          <div id="messages" style="flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column">
            <div style="text-align:center;padding:20px"><div style="background:white;padding:12px 16px;border-radius:16px;display:inline-block;border:1px solid #eee;font-size:13px">🔒 End-to-end encrypted family chat<br><span style="opacity:.6">Family Code: ${curFam.code} • Invite link ready</span><br><br><div style="font-size:11px">Share this link with family:<br><input class="input" style="font-size:11px;padding:8px" value="${location.origin+location.pathname+'#invite='+btoa(unescape(encodeURIComponent(JSON.stringify({n:curFam.familyName,m:curFam.members,c:curFam.code}))))}" readonly onclick="this.select();navigator.clipboard.writeText(this.value)"></div></div></div>
            <div id="msg-list"></div>
          </div>
          <div style="padding:12px;background:white;border-top:1px solid #eee;display:flex;gap:8px">
            <input id="msg-input" class="input" placeholder="Message as ${curUser?curUser.name:'You'}..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button class="btn btn-black" onclick="sendMsg()">Send</button>
          </div>
        </div>
      </div>
    `;
    loadMessages();
    return;
  }

  // Landing / Create / Join
  const existing = Object.keys(families);
  root.innerHTML = `
    <div style="max-width:520px;margin:0 auto;padding:20px;overflow:auto;height:100vh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">FamLine</h2><span class="badge">SECURE • PRIVATE • YOURS</span></div>
      
      ${existing.length?`
        <div class="card" style="margin-bottom:16px">
          <h4 style="margin:0 0 12px">Your families on this device</h4>
          ${existing.map(c=>{
            const f=families[c]; return `<div class="member-row" style="justify-content:space-between"><div><b>${f.familyName}</b> • <span style="font-size:11px">${f.code}</span><br><span style="font-size:11px;opacity:.6">${f.members.map(m=>m.name).join(', ')}</span></div><button class="btn btn-orange" style="padding:8px 14px" onclick="setCurrentCode('${c}');const u=getFamilies()['${c}'].members[0];setCurrentUser({name:u.name,role:u.role});view='chat';render()">Open</button></div>`;
          }).join('')}
          <button onclick="if(confirm('Clear all families on this device?')){localStorage.clear();location.reload()}" style="background:none;border:0;color:#ef4444;font-size:12px;margin-top:8px">Clear all families</button>
        </div>
      `:''}

      <div class="card" style="margin-bottom:16px">
        <h1 style="margin:0 0 8px;font-size:22px">Your Family, Private & Secure</h1>
        <p style="opacity:.7;font-size:13px;margin:0 0 20px;line-height:1.5">No cloud, E2E encrypted. Create a new family or join with code + password. Each phone joins as its own account so you know who is messaging.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <button class="btn btn-black" onclick="view='create';render()">+ Create Family</button>
          <button class="btn" style="background:white;border:2px solid #111" onclick="view='join';joinPrefillCode='${joinPrefillCode}';render()">↪ Join Family</button>
        </div>
      </div>

      ${view==='create'?`
        <div class="card" style="margin-bottom:16px">
          <h3 style="margin:0 0 4px">Create Family</h3>
          <p style="font-size:12px;opacity:.6;margin:0 0 12px">This will be the Nehme family: Abdallah Father, Nado Mother, Talia Daughter, Mohamad Son, Perla Daughter</p>
          <label style="font-size:11px;font-weight:700">FAMILY NAME</label>
          <input id="c-fname" class="input" value="Nehme" style="margin:6px 0 12px">
          <div id="c-members-list">${createMembers.map((m,i)=>`
            <div class="member-row"><span style="font-size:20px">${m.emoji}</span><input class="input" style="flex:1" value="${m.name}" onchange="createMembers[${i}].name=this.value"><select class="input" style="width:110px" onchange="createMembers[${i}].role=this.value"><option ${m.role==='Father'?'selected':''}>Father</option><option ${m.role==='Mother'?'selected':''}>Mother</option><option ${m.role==='Son'?'selected':''}>Son</option><option ${m.role==='Daughter'?'selected':''}>Daughter</option></select><button onclick="createMembers.splice(${i},1);render()" style="border:0;background:#fee2e2;padding:8px;border-radius:8px">✕</button></div>
          `).join('')}</div>
          <button class="btn" style="width:100%;background:#fff;border:1px dashed #ccc;margin:8px 0" onclick="createMembers.push({name:'',role:'Son',emoji:'👤',age:'Kid'});render()">+ Add Member</button>
          <label style="font-size:11px;font-weight:700">FAMILY PASSWORD (E2E Key - never leaves device)</label>
          <input id="c-pwd" class="input" type="password" placeholder="Secret only family knows" style="margin:6px 0 12px">
          <label style="font-size:11px;font-weight:700">YOUR NAME (who is creating on this device?)</label>
          <input id="c-myname" class="input" value="Abdallah" placeholder="e.g. Abdallah" style="margin:6px 0 12px">
          <button class="btn btn-black" style="width:100%" onclick="doCreate()">Create Family → Get Invite Link</button>
          <div id="c-result" style="display:none;margin-top:16px"></div>
        </div>
      `:''}

      ${view==='join'?`
        <div class="card" style="border:2px solid #f97316">
          <h3 style="margin:0 0 6px">Join Family</h3>
          <p style="font-size:12px;opacity:.7;margin:0 0 14px">Enter the code and password shared by family admin. Each device joins as its own account, so messages show who sent them.</p>
          <label style="font-size:11px;font-weight:700">FAMILY CODE (e.g. FAM-EH0J-ZN06)</label>
          <input id="j-code" class="input" placeholder="FAM-XXXX-XXXX" value="${joinPrefillCode}" style="text-transform:uppercase;margin:6px 0 12px">
          <label style="font-size:11px;font-weight:700">FAMILY PASSWORD</label>
          <input id="j-pwd" class="input" type="password" placeholder="Family password" style="margin:6px 0 12px">
          <label style="font-size:11px;font-weight:700">YOUR NAME (e.g. Talia, Nado)</label>
          <input id="j-name" class="input" placeholder="Your name in family" style="margin:6px 0 12px">
          <label style="font-size:11px;font-weight:700">YOUR ROLE</label>
          <select id="j-role" class="input" style="margin:6px 0 16px"><option>Father</option><option>Mother</option><option>Son</option><option selected>Daughter</option></select>
          <button class="btn btn-black" style="width:100%" onclick="doJoin()">Join as Me → Enter Chat</button>
          <div id="j-err" style="color:#ef4444;font-size:13px;margin-top:10px;display:none"></div>
          <div style="margin-top:12px;font-size:11px;opacity:.6">Don't have code? Ask admin for invite link like https://famline-web.onrender.com/#invite=...</div>
        </div>
      `:''}
    </div>
  `;
}

function doCreate(){
  const famName=document.getElementById('c-fname').value.trim()||'Nehme';
  const pwd=document.getElementById('c-pwd').value.trim();
  const myName=document.getElementById('c-myname').value.trim()||createMembers[0].name;
  if(!pwd){alert('Set a family password! This is your encryption key.');return;}
  if(createMembers.some(m=>!m.name.trim())){alert('Fill all member names');return;}
  const code=genCode();
  const fam={familyName:famName,name:famName,code:code,familyCode:code,members:createMembers,password:pwd,createdAt:Date.now()};
  const all=getFamilies(); all[code]=fam; saveFamilies(all); setCurrentCode(code);
  setCurrentUser({name:myName,role:createMembers.find(m=>m.name===myName)?.role||'Father'});
  localStorage.setItem('famline_family_v2', JSON.stringify(fam));
  const payload={n:famName,m:fam.members,c:code,full:fam.members};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const invite=location.origin+location.pathname+'#invite='+b64;
  document.getElementById('c-result').style.display='block';
  document.getElementById('c-result').innerHTML=`
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px">
      <b>Family ${famName} created!</b><br>Code: <b style="font-size:18px">${code}</b><br><br>
      <div style="font-size:11px">Invite link - share with Talia, Nado, etc:</div>
      <input class="input" style="font-size:11px;padding:8px" value="${invite}" readonly onclick="this.select();navigator.clipboard.writeText(this.value);alert('Copied!')">
      <div style="margin-top:12px"><button class="btn btn-black" style="width:100%" onclick="view='chat';render()">Enter Chat →</button></div>
    </div>
  `;
}

function doJoin(){
  const codeEl=document.getElementById('j-code'); const pwdEl=document.getElementById('j-pwd'); const nameEl=document.getElementById('j-name'); const roleEl=document.getElementById('j-role'); const errEl=document.getElementById('j-err');
  const code=(codeEl.value||'').trim().toUpperCase(); const pwd=(pwdEl.value||'').trim(); const myName=(nameEl.value||'').trim(); const role=roleEl.value;
  if(!code||!pwd||!myName){errEl.style.display='block';errEl.textContent='Fill code, password, and your name (e.g. Talia)';return;}
  let all=getFamilies(); let fam=all[code];
  // Try invite data
  let inviteData=null;
  if(location.hash.includes('invite=')){try{const b64=location.hash.split('invite=')[1];inviteData=JSON.parse(decodeURIComponent(escape(atob(b64))));}catch(e){}}
  if(!fam){
    if(inviteData && (inviteData.c===code || true)){
      const mems=(inviteData.full||[]).length?inviteData.full:(inviteData.m||[]).map(n=>typeof n==='string'?{name:n,role:'Member',emoji:'👤'}:n);
      const list=mems.length?mems:[{name:'Abdallah',role:'Father',emoji:'👨'},{name:'Nado',role:'Mother',emoji:'👩'},{name:'Talia',role:'Daughter',emoji:'👧'},{name:'Mohamad',role:'Son',emoji:'👦'},{name:'Perla',role:'Daughter',emoji:'👧'}];
      if(!list.find(x=>x.name.toLowerCase()===myName.toLowerCase())) list.push({name:myName,role:role,emoji:role==='Father'?'👨':role==='Mother'?'👩':role==='Son'?'👦':'👧'});
      fam={familyName:inviteData.n||'Nehme',name:inviteData.n||'Nehme',code:code,familyCode:code,members:list,password:pwd,createdAt:Date.now()};
    }else{
      // Hardcoded fallback for Nehme
      if(code==='FAM-EH0J-ZN06'){
        fam={familyName:'Nehme',name:'Nehme',code:'FAM-EH0J-ZN06',familyCode:'FAM-EH0J-ZN06',members:[{name:'Abdallah',role:'Father',emoji:'👨'},{name:'Nado',role:'Mother',emoji:'👩'},{name:'Talia',role:'Daughter',emoji:'👧'},{name:'Mohamad',role:'Son',emoji:'👦'},{name:'Perla',role:'Daughter',emoji:'👧'}],password:pwd,createdAt:Date.now()};
        if(!fam.members.find(x=>x.name.toLowerCase()===myName.toLowerCase())) fam.members.push({name:myName,role:role,emoji:'👤'});
      }else{
        fam={familyName:'Family '+code.slice(-4),name:'Family '+code.slice(-4),code:code,familyCode:code,members:[{name:myName,role:role,emoji:role==='Father'?'👨':role==='Mother'?'👩':role==='Son'?'👦':'👧'}],password:pwd,createdAt:Date.now()};
      }
    }
    all[code]=fam; saveFamilies(all);
  }else{
    if(fam.password && fam.password!==pwd){errEl.style.display='block';errEl.textContent='Wrong password - ask admin for correct password';return;}
    if(!fam.members.find(x=>x.name.toLowerCase()===myName.toLowerCase())){
      fam.members.push({name:myName,role:role,emoji:role==='Father'?'👨':role==='Mother'?'👩':role==='Son'?'👦':'👧'});
      all[code]=fam; saveFamilies(all);
    }
  }
  localStorage.setItem('famline_family_v2', JSON.stringify(fam));
  setCurrentCode(code); setCurrentUser({name:myName,role:role});
  view='chat'; render();
}

// Messages (local demo, P2P would need signaling)
function getMsgsKey(){return 'famline_msgs_'+(getCurrentCode()||'default')}
function loadMessages(){
  const key=getMsgsKey(); const msgs=JSON.parse(localStorage.getItem(key)||'[]');
  const list=document.getElementById('msg-list'); if(!list) return;
  const curUser=getCurrentUser();
  list.innerHTML=msgs.map(m=>`<div class="msg ${m.sender===curUser?.name?'me':'other'}"><b style="font-size:11px;display:block;opacity:.7">${m.sender} • ${m.role}</b>${m.text}<br><span style="font-size:10px;opacity:.6">${new Date(m.ts).toLocaleTimeString()}</span></div>`).join('');
  const cont=document.getElementById('messages'); if(cont) cont.scrollTop=cont.scrollHeight;
}
function sendMsg(){
  const input=document.getElementById('msg-input'); if(!input||!input.value.trim()) return;
  const text=input.value.trim(); const curUser=getCurrentUser()||{name:'You',role:''};
  const key=getMsgsKey(); const msgs=JSON.parse(localStorage.getItem(key)||'[]');
  msgs.push({sender:curUser.name,role:curUser.role,text:text,ts:Date.now()});
  localStorage.setItem(key, JSON.stringify(msgs)); input.value=''; loadMessages();
}

// Init
(function(){
  const p=new URLSearchParams(location.search);
  if(p.has('reset')){localStorage.clear();history.replaceState(null,'',location.pathname);view='landing';}
  if(p.has('join')){joinPrefillCode=p.get('join').toUpperCase();view='join';}
  if(location.hash.includes('invite=')){
    try{
      const b64=location.hash.split('invite=')[1];
      const data=JSON.parse(decodeURIComponent(escape(atob(b64))));
      joinPrefillCode=data.c||'FAM-EH0J-ZN06';
      view='join';
    }catch(e){}
  }
  const curCode=getCurrentCode(); const fams=getFamilies();
  if(curCode && fams[curCode] && !p.has('join') && !location.hash.includes('invite=')){view='chat';}
  render();
})();
</script>
</body>
</html>
