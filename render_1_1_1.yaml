
services:
  - type: web
    name: famline-signaling
    env: node
    plan: free
    region: frankfurt
    rootDir: signaling
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: famline-web
    env: static
    plan: free
    region: frankfurt
    rootDir: web
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
